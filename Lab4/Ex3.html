<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <style>
        body { font-family: Arial; }
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
    </style>
</head>
<body>

<h2>Student Management System</h2>

<input type="text" id="id" placeholder="Student ID">
<input type="text" id="name" placeholder="Name">
<input type="text" id="dept" placeholder="Department">
<input type="number" id="marks" placeholder="Marks">
<button onclick="addStudent()">Add Student</button>

<p id="message"></p>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Dept</th>
            <th>Marks</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>

let students = [];

function addStudent() {

    const id = document.getElementById("id").value;
    const name = document.getElementById("name").value;
    const dept = document.getElementById("dept").value;
    const marks = document.getElementById("marks").value;

    if (!id || !name) {
        document.getElementById("message").innerHTML = "❌ Please fill required fields";
        return;
    }

    const student = { id, name, dept, marks };

    students.push(student);

    document.getElementById("message").innerHTML = "✅ Student added successfully";

    displayStudents();
}

function displayStudents() {

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    students.forEach((student, index) => {
        table.innerHTML += `
            <tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.dept}</td>
                <td>${student.marks}</td>
                <td>
                    <button onclick="deleteStudent(${index})">Delete</button>
                </td>
            </tr>
        `;
    });
}

function deleteStudent(index) {
    students.splice(index, 1);
    displayStudents();
}

</script>

</body>
</html>
