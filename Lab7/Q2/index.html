<!DOCTYPE html>
<html>

<head>
<title>Online Book Finder</title>
</head>

<body>

<h2>Search Book</h2>

<input id="searchTitle" placeholder="Enter title">
<button onclick="searchBook()">Search</button>

<h2>Filter Category</h2>

<button onclick="filterCategory('Programming')">Programming</button>
<button onclick="filterCategory('AI')">AI</button>

<h2>Sort Books</h2>

<button onclick="sortPrice()">Sort by Price</button>
<button onclick="sortRating()">Sort by Rating</button>

<h2>Top Rated</h2>

<button onclick="topRated()">Show Top Rated</button>

<h2>Results</h2>

<div id="result"></div>

<script>

function searchBook(){

let title=document.getElementById("searchTitle").value;

console.log("AJAX Request:");
console.log("GET /books/search?title="+title);

alert("MongoDB Query:\n db.books.find({title:{$regex:'"+title+"',$options:'i'}})");

}

function filterCategory(cat){

alert("MongoDB Query:\n db.books.find({category:'"+cat+"'})");

}

function sortPrice(){

alert("MongoDB Query:\n db.books.find().sort({price:1})");

}

function sortRating(){

alert("MongoDB Query:\n db.books.find().sort({rating:-1})");

}

function topRated(){

alert("MongoDB Query:\n db.books.find({rating:{$gte:4}}).limit(5)");

}

</script>

</body>
</html>
